
name: Build Pygame EXE

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    name: Windows ${{ matrix.arch }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86
            python-architecture: x86
          - arch: x64
            python-architecture: x64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: ${{ matrix.python-architecture }}

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install pygame pyinstaller
          if (Test-Path requirements.txt) {
            python -m pip install -r requirements.txt
          }

      - name: Build EXE
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name HorrorGame --add-data "assets;assets" main.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: HorrorGame-Windows-${{ matrix.arch }}
          path: dist/HorrorGame.exe
          if-no-files-found: error
