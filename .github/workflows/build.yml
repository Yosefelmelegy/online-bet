
name: Build BaytAlHams for Windows

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.arch }} EXE
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86
            python_arch: x86
          - arch: x64
            python_arch: x64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: ${{ matrix.python_arch }}

      - name: Verify Python architecture
        shell: pwsh
        run: |
          python -c "import struct; print('Python:', struct.calcsize('P') * 8, 'bit')"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller
          if (Test-Path requirements.txt) {
            python -m pip install -r requirements.txt
          }

      - name: Validate required files
        shell: pwsh
        run: |
          $required = @(
            "main.py",
            "assets",
            "online_config.json"
          )

          foreach ($item in $required) {
            if (-not (Test-Path $item)) {
              throw "Missing required file or folder: $item"
            }
          }

      - name: Build game EXE
        shell: pwsh
        run: |
          $args = @(
            "--noconfirm",
            "--clean",
            "--onefile",
            "--windowed",
            "--name", "BaytAlHams",
            "--add-data", "assets;assets",
            "--add-data", "online_config.json;.",
            "--hidden-import", "online_net",
            "--hidden-import", "pyttsx3.drivers",
            "--hidden-import", "pyttsx3.drivers.sapi5"
          )

          if (Test-Path "assets/icon.ico") {
            $args += @("--icon", "assets/icon.ico")
          }

          $args += "main.py"

          python -m PyInstaller @args

          if (-not (Test-Path "dist/BaytAlHams.exe")) {
            throw "EXE build failed."
          }

      - name: Package server source
        shell: pwsh
        run: |
          if ((Test-Path "server.py") -and
              (Test-Path "online_config.json")) {
            New-Item -ItemType Directory -Force `
              -Path "server-package" | Out-Null

            Copy-Item "server.py", "online_config.json" `
              -Destination "server-package"

            Compress-Archive `
              -Path "server-package/*" `
              -DestinationPath "dist/BaytAlHams-Server-Source-${{ matrix.arch }}.zip" `
              -Force
          }

      - name: Rename EXE for architecture
        shell: pwsh
        run: |
          Move-Item "dist/BaytAlHams.exe" `
            "dist/BaytAlHams-${{ matrix.arch }}.exe"

      - name: Upload game EXE
        uses: actions/upload-artifact@v4
        with:
          name: BaytAlHams-Windows-${{ matrix.arch }}
          path: dist/BaytAlHams-${{ matrix.arch }}.exe
          if-no-files-found: error
          compression-level: 0

      - name: Upload server source
        if: hashFiles('server.py') != ''
        uses: actions/upload-artifact@v4
        with:
          name: BaytAlHams-Server-Source-${{ matrix.arch }}
          path: dist/BaytAlHams-Server-Source-${{ matrix.arch }}.zip
          if-no-files-found: warn
          compression-level: 0
