
name: Build BaytAlHams EXE

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build-windows:
    name: Build Windows ${{ matrix.arch }}
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86
            python_arch: x86
          - arch: x64
            python_arch: x64

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: ${{ matrix.python_arch }}

      - name: Check project files
        shell: pwsh
        run: |
          if (!(Test-Path "main.py")) {
            throw "main.py was not found"
          }

          if (!(Test-Path "requirements.txt")) {
            throw "requirements.txt was not found"
          }

          if (!(Test-Path "assets")) {
            throw "assets folder was not found"
          }

          Write-Host "Python architecture:"
          python -c "import struct; print(str(struct.calcsize('P') * 8) + '-bit')"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Build EXE
        shell: pwsh
        run: |
          $args = @(
            "--noconfirm",
            "--clean",
            "--onefile",
            "--windowed",
            "--name", "BaytAlHams",
            "--add-data", "assets;assets",
            "--hidden-import", "arabic_reshaper",
            "--hidden-import", "bidi",
            "--hidden-import", "pyttsx3.drivers",
            "--hidden-import", "pyttsx3.drivers.sapi5",
            "--hidden-import", "server"
          )

          if (Test-Path "assets/icon.ico") {
            $args += @("--icon", "assets/icon.ico")
          }

          $args += "main.py"

          python -m PyInstaller @args

          if (!(Test-Path "dist/BaytAlHams.exe")) {
            throw "EXE was not created"
          }

          Move-Item "dist/BaytAlHams.exe" `
            "dist/BaytAlHams-${{ matrix.arch }}.exe"

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: BaytAlHams-Windows-${{ matrix.arch }}
          path: dist/BaytAlHams-${{ matrix.arch }}.exe
          if-no-files-found: error
          compression-level: 0

      - name: Package server source
        if: hashFiles('server.py') != ''
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force `
            -Path server-package | Out-Null

          Copy-Item server.py server-package/

          if (Test-Path "requirements.txt") {
            Copy-Item requirements.txt server-package/
          }

          Compress-Archive `
            -Path server-package/* `
            -DestinationPath "dist/BaytAlHams-Server-${{ matrix.arch }}.zip" `
            -Force

      - name: Upload server source
        if: hashFiles('server.py') != ''
        uses: actions/upload-artifact@v4
        with:
          name: BaytAlHams-Server-${{ matrix.arch }}
          path: dist/BaytAlHams-Server-${{ matrix.arch }}.zip
          if-no-files-found: error
          compression-level: 0
